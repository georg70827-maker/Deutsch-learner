<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deutsch Learner - 第一步</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page">
      <p class="eyebrow">Deutsch Learner · 第一步</p>
      <h1>查一个德语单词</h1>
      <p class="intro">先做页面交互，暂时使用模拟查询结果。</p>

      <form id="word-form">
        <label for="word-input">学习请求</label>
        <div class="search-row">
          <input id="word-input" name="word" placeholder="例如：查 gehen / 我想学习语法" autocomplete="off" />
          <button type="submit">发送</button>
        </div>
      </form>

      <section class="result" aria-live="polite">
        <h2>结果</h2>
        <p id="result-text">请输入一个单词，然后点击“查询”。</p>
        <div id="word-card" class="word-card" hidden>
          <p><span class="detail-label">单词：</span><span id="result-word"></span></p>
          <p><span class="detail-label">词义：</span><span id="result-meaning"></span></p>
          <p><span class="detail-label">词性：</span><span id="result-part-of-speech"></span></p>
          <p><span class="detail-label">例句：</span><span id="result-example"></span></p>
        </div>
      </section>

      <section class="chat-panel">
        <h2>普通聊天</h2>
        <div id="chat-log" class="chat-log" aria-live="polite">
          <p class="chat-empty">和 DeepSeek 聊聊德语学习吧。</p>
        </div>
        <form id="chat-form" class="chat-form">
          <input id="chat-input" placeholder="例如：Wie sagt man ‘我喜欢阅读’ auf Deutsch?" autocomplete="off" />
          <button type="submit">发送</button>
        </form>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
